name: Automated Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  merged_pr:
    name: Confirm main push came from a merged PR
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - name: Check merged PR association
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          merged = False
          for attempt in range(5):
              prs = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/commits/{sha}/pulls"], text=True
              ))
              merged = any(
                  pr.get("merged_at")
                  and pr.get("merge_commit_sha") == sha
                  and pr.get("base", {}).get("ref") == "main"
                  for pr in prs
              )
              if merged:
                  break
              if attempt < 4:
                  time.sleep(3)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"merged={str(merged).lower()}\n")
          print(f"Merged PR commit: {merged}")
          PY

  version:
    name: Reconcile Release Version
    needs: merged_pr
    if: needs.merged_pr.outputs.merged == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculate unique release version
        id: version_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_version.py

  test:
    name: Verify tests before release
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core and distribution tests
        run: >-
          python -m unittest
          tests.test_auto_pr tests.test_cache tests.test_cli tests.test_diagnostics
          tests.test_host_safety tests.test_launcher tests.test_picker tests.test_profiles
          tests.test_quota_api tests.test_rotator tests.test_statusline tests.test_subscription
          tests.test_tokens tests.test_usage tests.test_updater tests.test_wincred
          tests.council.test_packaging tests.test_release_version

  build-wheel:
    name: Build wheel and source tarball
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_version.py --set-version "$RELEASE_VERSION"
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-standalone:
    name: Build standalone (${{ matrix.os }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: agym-windows-amd64.exe
            dist_path: dist/agym.exe
          - os: ubuntu-latest
            target_name: agym-linux-amd64
            dist_path: dist/agym
          - os: macos-latest
            target_name: agym-darwin-arm64
            dist_path: dist/agym
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_version.py --set-version "$RELEASE_VERSION"
      - name: Build executable
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name agym --clean --paths . --collect-data agym scripts/agym_entry.py
      - name: Smoke test executable
        shell: bash
        env:
          DIST_PATH: ${{ matrix.dist_path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          "./$DIST_PATH" --help
          test "$("./$DIST_PATH" --version)" = "$RELEASE_VERSION"
          printf '{}' | "./$DIST_PATH" --statusline-render
      - name: Name release asset
        shell: bash
        env:
          DIST_PATH: ${{ matrix.dist_path }}
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          mkdir -p release_bin
          cp "$DIST_PATH" "release_bin/$TARGET_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: release_bin/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [version, build-wheel, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: all_artifacts
      - name: Prepare release assets
        run: |
          mkdir release_assets
          find all_artifacts -type f -exec cp {} release_assets/ \;
          test "$(find release_assets -type f | wc -l)" -eq 5
      - name: Tag versioned source
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
        run: |
          python scripts/release_version.py --set-version "$RELEASE_VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml agym/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: agym ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*
