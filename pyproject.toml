[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agym"
version = "0.1.0"
description = "Explicit isolated-profile launcher for Google Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "agym contributors"}]
dependencies = []

[project.optional-dependencies]
council = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "aiofiles",
]

[project.scripts]
agym = "agym.cli:main"
agym-statusline = "agym.statusline:main"
agym-council = "agym.council.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agym*"]

[tool.setuptools.package-data]
"agym.council" = ["presets/*.json", "web_dist/**/*"]
